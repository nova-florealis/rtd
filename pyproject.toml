[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtd"
version = "0.1.0"
description = "Real-time diffusion tools"
authors = [{ name = "Lunar Ring", email = "info@lunar-ring.ai" }]
license = { text = "BSD 3-Clause" }
readme = "README.md"
requires-python = "==3.11.5"
dependencies = [
  "huggingface_hub",
  "diffusers",
  "tokenizers",
  "lunar_tools @ git+https://github.com/lunarring/lunar_tools",
  "tac @ git+https://github.com/lunarring/tac",
  "transformers",
  "timm",
  "torch",
  "Pillow",
  "accelerate",
  "numpy",
  "sounddevice",
  "spatial-correlation-sampler==0.5.0",
  "openai>=1.6.1",
  "ultralytics>=8.3.81",
  "xformers>=0.0.29.post1",
  "python-dotenv>=1.0.1",
  "stable-fast>=1.0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
